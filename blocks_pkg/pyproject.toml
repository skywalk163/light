[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "light-blocks"
version = "1.0.1"
description = "光明积木组合平台——零 token 组合式代码生成（选块/校验/接线/粘合全本地）"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Light Contributors"},
]
keywords = ["programming-language", "chinese", "compositional-generation", "zero-token"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
zh = [
    "pypinyin",
    "opencc-python-reimplemented",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
light-combo = "light_blocks.cli:main"

[tool.setuptools]
packages = ["light_blocks"]

[tool.setuptools.package-data]
light_blocks = ["_data/**/*"]
