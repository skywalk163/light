[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "light"
version = "6.0.0"
description = "光明（Light）v6.0 — 像中文一样的中文编程语言（五层分层语法架构）"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Light Contributors"},
]
keywords = ["programming-language", "chinese", "nlp", "compiler", "hm-inference", "null-safety", "module-system"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Education",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
antlr = [
    "antlr4-python3-runtime>=4.13.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "autopep8>=2.0.0",
]
llvm = [
    # LLVM bindings (requires manual LLVM installation)
]
repl = [
    "prompt-toolkit>=3.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "pymdown-extensions>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/skywalk163/light"
Source = "https://github.com/skywalk163/light"
BugTracker = "https://github.com/skywalk163/light/issues"
Documentation = "https://github.com/skywalk163/light/tree/main/docs"
GitCode = "https://gitcode.com/skywalk163/light"

[project.scripts]
light = "cli.light:main"
lightc = "cli.lightc:main"

[tool.setuptools.packages.find]
include = ["src*", "cli*", "stdlib*", "antlrparser*"]
exclude = [
    "tests*", "benchmarks*", "examples*", "project*", "bootstrap*",
    "docs*", "tools*", "lsp*", "debug-adapter*", "vscode-extension*", "scripts*",
    "**/test*", "**/*_test*", "**/self_hosted*", "**/light_parser*", "**/light_parser2*", "**/light_parser_new*",
    "**/web_playground*", "**/*_debug*", "**/ir.py", "**/codegen_x64.py", "**/linker.py"
]

[tool.setuptools.package-data]
"*" = ["*.light", "*.toml"]
"stdlib" = ["*.light", "*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "_test_*.py"]
addopts = "-v --tb=short --ignore=tests/archive"
norecursedirs = ["archive", "__pycache__"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.github/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E203", "E501",       # 行长度已在 max-line-length 控制
    "W293",               # 空行包含空白字符（预存格式问题）
    "W291",               # 尾随空白字符
    "W292",               # 文件末尾缺少换行符
    "F541",               # f-string 无占位符
    "E302",               # 期望 2 个空行
    "E231",               # 逗号后缺少空格
    "E128", "E127",       # 续行缩进
    "E722",               # bare except
    "E741",               # 歧义变量名
    "E402",               # 模块级导入不在文件顶部
    "E301", "E303", "E305", "E306",  # 空行数量
    "E124", "E129", "E131",          # 括号/缩进对齐
    "E261",               # 行内注释前空格
    "E271",               # 关键字后多余空格
    "E721",               # type() 比较
    "E731",               # lambda 赋值
    "E702",               # 一行多个语句
    "E712",               # 布尔比较
    "E401",               # 一行多个 import
    "F403",               # star import 无法检测未定义名称
    "F402",               # import 被循环变量遮蔽
    "W391",               # 文件末尾空行
    "F811",               # 变量重定义
    "F601",               # 字典键重复
]
exclude = [
    "__pycache__",
    "antlrparser/light_parser/*.py",
    "antlrparser/*.py",
]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true