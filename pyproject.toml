[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guangming"
version = "0.4.2"
description = "光明（Light）v0.4 — 像中文一样的中文自然语言编程语言（五层分层语法架构 · 自举编译器 · 积木库）"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Light Contributors"},
]
keywords = ["programming-language", "chinese", "nlp", "compiler", "hm-inference", "null-safety", "module-system"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Education",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
antlr = [
    "antlr4-python3-runtime>=4.13.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # ── addopts 硬依赖（缺了 pytest 直接 unrecognized arguments 起不来）─────────
    # pyproject 的 tool.pytest.ini_options 段里 addopts 写死 `--timeout=120 -n 4
    # --dist=loadscope`（T-0390 从 60 放宽到 120，见下面 addopts 处的说明），
    # 分别需要下面两个插件；早前 dev 组漏声明，导致
    # `pip install .[dev]` 装完仍跑不动测试套件（2026-09-25 GitHub CI 首跑暴露）。
    # ⚠️ 注释里**不要**出现带方括号的 pytest 配置段名：test_capture_encoding_guard.py
    #    用 `配置.split('[段名]',1)` 定位段落，注释里出现同名字面量会把分割点抢走 → 断言假红。
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.3.0",
    # ── 测试所需运行时依赖（对齐 scripts/ensure_venv.py 的 WATCH/LOCKED 清单）──
    "antlr4-python3-runtime>=4.13.0",  # antlr 后端用例
    "psutil>=5.9.0",                   # 进程树 / 子进程用例
    "lunardate>=0.3.0",                # 农历 / 历法 / 日期时间用例
    "requests>=2.34.0",                # lightpub HTTP 客户端用例（R161-E 补登记）
    "cryptography>=50.0.0",            # TLS 用例：test_tls_light / test_async_io_light（R161-E 补登记）
    "flask>=3.1.0",                    # Playground API 用例：test_playground_api 22 例（R167-T2 补登记）
    "flask-cors>=6.0.0",               # 同上，**必须与 flask 成对**：playground/server.py 同时
                                       # `from flask import …` 与 `from flask_cors import CORS`，
                                       # 只装 flask 时 22 例照旧全 skip（R167-T2 实测）
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "autopep8>=2.0.0",
]
llvm = [
    # LLVM bindings (requires manual LLVM installation)
]
repl = [
    "prompt-toolkit>=3.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "pymdown-extensions>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/skywalk163/light"
Source = "https://github.com/skywalk163/light"
BugTracker = "https://github.com/skywalk163/light/issues"
Documentation = "https://github.com/skywalk163/light/tree/main/docs"
GitCode = "https://gitcode.com/skywalk163/light"

[project.scripts]
light = "cli.light:main"
lightc = "cli.lightc:main"

[tool.setuptools.packages.find]
include = ["src*", "cli*", "stdlib*", "antlrparser*"]
exclude = [
    "tests*", "benchmarks*", "examples*", "project*", "bootstrap*",
    "docs*", "tools*", "lsp*", "debug-adapter*", "vscode-extension*", "scripts*",
    "**/test*", "**/*_test*", "**/self_hosted*", "**/light_parser*", "**/light_parser2*", "**/light_parser_new*",
    "**/web_playground*", "**/*_debug*", "**/ir.py", "**/codegen_x64.py", "**/linker.py",
]

[tool.setuptools.package-data]
"*" = ["*.light", "*.toml"]
# 智能原语弹性层的默认映射表是 JSON（src/smart_primitives_map.json）。
# 之前这里只收 *.light / *.toml，导致 wheel 内缺表、装后只能回退内置兜底表（3 条原语）。
"src" = ["*.json"]
"stdlib" = ["*.light", "*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "_test_*.py"]
# 不放 `-v`：全量约 3800 条用例，逐条打印只是把 log 撑大、把 CI 拖慢，
# 定位失败靠 --tb=short 就够。--durations=15 让「哪一条慢」每轮自报，
# 免得下次又要专门测一遍才知道时间花在哪（2026-08-22 CI 时间治理）。
# ── R94 开发冻结（裁定 1）：默认 worker 数 `-n auto` → `-n 4` ──────────────────
# 依据 R93-B 实测（本机 10 核，全量 tests/，--dist=loadscope）：
#   -n auto(=10) → 11~13 红；-n 6 → 3 红（judge 新增红 1）；-n 4 → 1 红且全落台账，
#   judge 新增红 0、连续 3 轮 0 次 node down；-n 8 → node down + 挂死（未完成）。
# ⚠️ -n 4 **不是修复**，只是降低资源争抢与暴露面：整机 CPU ≥80% 时仍可能崩，
#    机理未定性（见 docs/known-issues/R94-xdist-worker-kill.md）。
# 覆盖规则：命令行出现的 `-n <N>` 在 addopts 之后，后者生效。因此 0.82 全量回归
#    脚本（scripts/082全量回归.py 显式补 `-n auto`）仍走高吞吐，远端不受影响。
addopts = "--tb=short --durations=15 --ignore=tests/archive --timeout=120 -n 4 --dist=loadscope"
norecursedirs = ["archive", "__pycache__"]
# 2026-09-08 CI 时间治理（task-CIperf）：注册 slow 标记。CI 在 PR 触发时传
# `-m "not slow"` 跳过 e2e / 编译大项目等長耗时用例（push main 仍跑全量）。
# 注册后 pytest 不再对 @pytest.mark.slow 报 "unknown mark" 警告。
markers = [
    "slow: 慢测试（e2e / 编译大项目 / 长耗时），PR 触发时跳过，main 推送时全量运行",
]
# ── T-0390：全局 --timeout=60 是「每用例」上限，落在踩线用例的实测耗时上 ──────
# 现象（T-0383 §3.5）：0.88 全量 `-n 6` 下，一批用例实测 52–61s，60s 上限直接压在
# 它们头上；机器被别的 agent 挤到 load≈15 时，这些用例就在 59–61s 之间随机翻红，
# 同一份提交三轮全量的失败集合互不相同（M2=21 / M3=19 / M4=14，来回翻 11 条）。
#
# 修法不是删掉超时（真卡死的用例会一路拖到 remote_ci 的 --timeout 5400s 才失败，
# 更难定位），而是**给慢用例单独提限**：标了 `slow` 的用例改由
# `LIGHT_SLOW_TIMEOUT`（默认 600s）接管，接线在
# tests/conftest.py::pytest_collection_modifyitems——它对每个 slow item 合成一条
# `timeout` marker，而 pytest-timeout 的 marker 优先级高于命令行 --timeout。
#
# 为什么秒数走环境变量而不是这里的 ini：本卡只允许改 tests / pyproject / tools，
# 而自定义 ini 选项要在 rootdir 的 conftest 用 pytest_addoption 注册（仓库根
# conftest.py 不在可改范围）。默认值写死在 tests/conftest.py 里，机器更慢时
# `LIGHT_SLOW_TIMEOUT=1200 python -m pytest …` 即可。
#
# 覆盖范围（T-0390 卡面 10 条 + 同批踩线文件，共 5 个文件整体标 slow）：
#   tests/unit/test_R220_归约与段落体.py        （test_B5 / test_B7）        16 条
#   tests/unit/test_R143_L199_向量追加.py        （test_A5 / test_双腿对拍2参追加一致）7 条
#   tests/unit/test_原生腿_R11A_通用工具.py      （test_断言工具_对拍Python）  8 条
#   tests/unit/test_原生腿_R11B_中文工具.py      （test_中文分词 / test_拼音转换）7 条
#   tests/e2e/test_e2e_chain.py                 （test_L075 / test_L076，**本来就** slow）
# 为什么整文件标而不是逐条：这几个文件里每条用例都真起子进程（编译 + 运行），
# 踩线风险是**文件属性**不是某一条的属性——逐条标反而会让同文件里没标上的兄弟
# 在下一轮负载里顶上来（P1 那条就是这么冒出来的）。整体标也更好审：一个文件
# 「重不重」在 pyproject 里一眼可见，不用去翻几十个装饰器。
#
# 代价（故意接受的取舍）：PR 流程的 `-m "not slow"` 会跳过上面 4 个文件的
# **38 条**（e2e_chain 的 194 条是本卡之前就标好的，不算这次新增）。全量门
# （main 推送 / remote_ci.py）照跑，卡面已确认这个取舍 OK。这批用例守的是
# 「真起子进程编译再跑」的联动契约，本来就不属于 PR 的快速门。
#
# 为什么还要把全局 60 提到 120（而不是只做 slow 提限）：卡面的 10 条清单**不全**。
# 实测在改完那 10 条之后连跑两轮，又冒出第 11 条翻的
# （test_R16x_L217_所有权收敛.py::test_P1字面量循环，39s setup + 24s call ≈ 63s，
#  单跑 54s）——它是同一类，只是 T-0383 三轮刚好没翻到。120 是给「还没被识别成
#  slow、却踩在 60s 上」的用例留的保护带，同时仍让真卡死的快用例在 120s 被掐，
# 不会拖到 remote_ci 的 5400s。

# 覆盖率：聚焦核心语言链路模块（lexer/parser/compiler/类型系统/codegen），合并双线配置
[tool.coverage.run]
branch = false
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.github/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
skip_covered = true

[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E203", "E501",       # 行长度已在 max-line-length 控制
    "W293",               # 空行包含空白字符（预存格式问题）
    "W291",               # 尾随空白字符
    "W292",               # 文件末尾缺少换行符
    "F541",               # f-string 无占位符
    "E302",               # 期望 2 个空行
    "E231",               # 逗号后缺少空格
    "E128", "E127",       # 续行缩进
    "E722",               # bare except
    "E741",               # 歧义变量名
    "E402",               # 模块级导入不在文件顶部
    "E301", "E303", "E305", "E306",  # 空行数量
    "E124", "E129", "E131",          # 括号/缩进对齐
    "E261",               # 行内注释前空格
    "E271",               # 关键字后多余空格
    "E721",               # type() 比较
    "E731",               # lambda 赋值
    "E702",               # 一行多个语句
    "E712",               # 布尔比较
    "E401",               # 一行多个 import
    "F403",               # star import 无法检测未定义名称
    "F402",               # import 被循环变量遮蔽
    "W391",               # 文件末尾空行
    "F811",               # 变量重定义
    "F601",               # 字典键重复
]
exclude = [
    "__pycache__",
    "antlrparser/light_parser/*.py",
    "antlrparser/*.py",
]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true