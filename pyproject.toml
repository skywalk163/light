[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "light"
version = "7.0.0"
description = "光明（Light）v7.0 — 像中文一样的中文自然语言编程语言（五层分层语法架构 · 自举编译器 · 积木库）"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Light Contributors"},
]
keywords = ["programming-language", "chinese", "nlp", "compiler", "hm-inference", "null-safety", "module-system"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Education",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
antlr = [
    "antlr4-python3-runtime>=4.13.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # ── addopts 硬依赖（缺了 pytest 直接 unrecognized arguments 起不来）─────────
    # pyproject 的 tool.pytest.ini_options 段里 addopts 写死 `--timeout=60 -n 4
    # --dist=loadscope`，分别需要下面两个插件；早前 dev 组漏声明，导致
    # `pip install .[dev]` 装完仍跑不动测试套件（2026-09-25 GitHub CI 首跑暴露）。
    # ⚠️ 注释里**不要**出现带方括号的 pytest 配置段名：test_capture_encoding_guard.py
    #    用 `配置.split('[段名]',1)` 定位段落，注释里出现同名字面量会把分割点抢走 → 断言假红。
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.3.0",
    # ── 测试所需运行时依赖（对齐 scripts/ensure_venv.py 的 WATCH/LOCKED 清单）──
    "antlr4-python3-runtime>=4.13.0",  # antlr 后端用例
    "psutil>=5.9.0",                   # 进程树 / 子进程用例
    "lunardate>=0.3.0",                # 农历 / 历法 / 日期时间用例
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "autopep8>=2.0.0",
]
llvm = [
    # LLVM bindings (requires manual LLVM installation)
]
repl = [
    "prompt-toolkit>=3.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "pymdown-extensions>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/skywalk163/light"
Source = "https://github.com/skywalk163/light"
BugTracker = "https://github.com/skywalk163/light/issues"
Documentation = "https://github.com/skywalk163/light/tree/main/docs"
GitCode = "https://gitcode.com/skywalk163/light"

[project.scripts]
light = "cli.light:main"
lightc = "cli.lightc:main"

[tool.setuptools.packages.find]
include = ["src*", "cli*", "stdlib*", "antlrparser*"]
exclude = [
    "tests*", "benchmarks*", "examples*", "project*", "bootstrap*",
    "docs*", "tools*", "lsp*", "debug-adapter*", "vscode-extension*", "scripts*",
    "**/test*", "**/*_test*", "**/self_hosted*", "**/light_parser*", "**/light_parser2*", "**/light_parser_new*",
    "**/web_playground*", "**/*_debug*", "**/ir.py", "**/codegen_x64.py", "**/linker.py",
]

[tool.setuptools.package-data]
"*" = ["*.light", "*.toml"]
"stdlib" = ["*.light", "*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "_test_*.py"]
# 不放 `-v`：全量约 3800 条用例，逐条打印只是把 log 撑大、把 CI 拖慢，
# 定位失败靠 --tb=short 就够。--durations=15 让「哪一条慢」每轮自报，
# 免得下次又要专门测一遍才知道时间花在哪（2026-08-22 CI 时间治理）。
# ── R94 开发冻结（裁定 1）：默认 worker 数 `-n auto` → `-n 4` ──────────────────
# 依据 R93-B 实测（本机 10 核，全量 tests/，--dist=loadscope）：
#   -n auto(=10) → 11~13 红；-n 6 → 3 红（judge 新增红 1）；-n 4 → 1 红且全落台账，
#   judge 新增红 0、连续 3 轮 0 次 node down；-n 8 → node down + 挂死（未完成）。
# ⚠️ -n 4 **不是修复**，只是降低资源争抢与暴露面：整机 CPU ≥80% 时仍可能崩，
#    机理未定性（见 docs/known-issues/R94-xdist-worker-kill.md）。
# 覆盖规则：命令行出现的 `-n <N>` 在 addopts 之后，后者生效。因此 0.82 全量回归
#    脚本（scripts/082全量回归.py 显式补 `-n auto`）仍走高吞吐，远端不受影响。
addopts = "--tb=short --durations=15 --ignore=tests/archive --timeout=60 -n 4 --dist=loadscope"
norecursedirs = ["archive", "__pycache__"]
# 2026-09-08 CI 时间治理（task-CIperf）：注册 slow 标记。CI 在 PR 触发时传
# `-m "not slow"` 跳过 e2e / 编译大项目等長耗时用例（push main 仍跑全量）。
# 注册后 pytest 不再对 @pytest.mark.slow 报 "unknown mark" 警告。
markers = [
    "slow: 慢测试（e2e / 编译大项目 / 长耗时），PR 触发时跳过，main 推送时全量运行",
]

# 覆盖率：聚焦核心语言链路模块（lexer/parser/compiler/类型系统/codegen），合并双线配置
[tool.coverage.run]
branch = false
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.github/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
skip_covered = true

[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E203", "E501",       # 行长度已在 max-line-length 控制
    "W293",               # 空行包含空白字符（预存格式问题）
    "W291",               # 尾随空白字符
    "W292",               # 文件末尾缺少换行符
    "F541",               # f-string 无占位符
    "E302",               # 期望 2 个空行
    "E231",               # 逗号后缺少空格
    "E128", "E127",       # 续行缩进
    "E722",               # bare except
    "E741",               # 歧义变量名
    "E402",               # 模块级导入不在文件顶部
    "E301", "E303", "E305", "E306",  # 空行数量
    "E124", "E129", "E131",          # 括号/缩进对齐
    "E261",               # 行内注释前空格
    "E271",               # 关键字后多余空格
    "E721",               # type() 比较
    "E731",               # lambda 赋值
    "E702",               # 一行多个语句
    "E712",               # 布尔比较
    "E401",               # 一行多个 import
    "F403",               # star import 无法检测未定义名称
    "F402",               # import 被循环变量遮蔽
    "W391",               # 文件末尾空行
    "F811",               # 变量重定义
    "F601",               # 字典键重复
]
exclude = [
    "__pycache__",
    "antlrparser/light_parser/*.py",
    "antlrparser/*.py",
]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true