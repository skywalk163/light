site_name: 光明 (LightLang) v7.0
site_description: 光明编程语言 - 中文编程语言的全新可能
site_author: LightLang Team
repo_url: https://github.com/skywalk163/light
repo_name: skywalk163/light
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  font:
    text: Noto Sans SC
    code: Noto Sans SC
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: teal
      accent: green
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: zh
  - git-revision-date-localized:
      enable_creation_date: true


markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
  - tables
  - footnotes

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/skywalk163/light

