site_name: 光明 (LightLang) v6.0
site_description: 光明编程语言 - 中文编程语言的全新可能
site_author: LightLang Team
repo_url: https://github.com/skywalk163/light
repo_name: skywalk163/light
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: teal
      accent: green
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: zh
  - git-revision-date-localized:
      enable_creation_date: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
  - tables
  - footnotes

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/light-lang/light

nav:
  - 首页: index.md
  - 用户手册: user_guide.md
  - 发布说明: release_notes_v6.0.md
  - 已知问题: known_issues.md
  - 快速入门:
    - 快速开始: guide/getting-started.md
    - 安装说明: guide/installation.md
    - VS Code 配置: guide/vscode-setup.md
  - 用户指南:
    - 分层语法入门: guide/分层语法入门.md
    - 快速开始: guide/快速开始.md
    - 常见问题: guide/常见问题.md
    - 迁移指南: guide/迁移指南.md
  - 语言参考:
    - 五层架构详解: language/levels.md
    - L0 核心字集: language/l0-core.md
    - L1/L2 文体: language/l1-l2-style.md
    - L3 领域嵌入: language/l3-domain.md
    - L4 外语引用: language/l4-foreign.md
    - 关键字参考: language/keywords.md
    - 运算符参考: language/operators.md
    - 类型系统: language/types.md
    - 完整语法参考: language/完整语法参考.md
  - 标准库:
    - 标准库索引: stdlib/index.md
    - 数学模块: stdlib/math.md
    - 字符串处理: stdlib/string.md
    - JSON 模块: stdlib/json.md
    - 文件系统: stdlib/file.md
    - 日期时间: stdlib/datetime.md
    - 正则表达式: stdlib/regex.md
  - 工具:
    - CLI 使用指南: tools/cli.md
    - Playground 使用: tools/playground.md
    - LSP 集成: tools/lsp.md
    - 调试器: tools/debugger.md
    - 搜索配置: 搜索配置.md
  - 生态:
    - 教学资源: ecosystem/教学资源.md
  - 迁移指南:
    - v3.3 → v4.0: migration/v3-to-v4.md
    - v4.0 → v5.x: migration/v4-to-v5.md
  - API 参考:
    - API 索引: api/index.md
    - 标准库 API: api/stdlib.md
    - 编译器 API: api/compiler.md
  - 知识库:
    - 知识库索引: 知识库/索引.md
    - 语言规范: 知识库/语言规范.md
    - 开发指南: 知识库/开发指南.md
    - 最佳实践: 知识库/最佳实践.md
    - 常见问题: 知识库/常见问题.md
  - 贡献指南: contributing.md