# 光明 Light · 本地 CI（Gitea Actions，FreeBSD host 模式，无 Docker）
#
# 这份文件源自段言侧，v7 合并后主干是 light，已按主干校正（见下方「根目录测试」注释）。
#
# 等价于 .github/workflows/ci.yml 的 Linux 测试路径：
#   - runs-on: freebsd（act_runner host 执行器；FreeBSD 无原生 Docker，只能 host 模式）
#   - 去掉 os 矩阵与 actions/setup-python，改用 jail 内系统 python3 建 venv
#   - checkout 走本地 actions/checkout 镜像
#   - 去掉 GitHub 专属的 build/twine/upload-artifact（release/publish 不在本地跑）
#
# 仅安装 pytest/pytest-cov（与 GitHub test job 一致）；本项目 runtime 依赖为空
# （pyproject dependencies=[]），测试直接 import 仓库内 src/ 模块。
#
# runner 部署（jail + act_runner 自编译 + 标签/镜像）见 docs/CI_gitea_freebsd部署.md。


name: CI

on:
  push:
    branches: [main, merge-v7]
  pull_request:
    branches: [main, merge-v7]
  workflow_dispatch:

jobs:
  test:
    runs-on: freebsd
    steps:
      - name: Checkout
        # 固定走本地 actions/checkout，避免 Gitea 对裸写 uses 的解析偶发回落到 github.com
        uses: http://192.168.1.5:3000/actions/checkout@v4

      - name: 安装测试依赖 (venv)
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov

      - name: 单元测试
        env:
          # 词法器 perf 预算：本地开发默认 2.0s（见 test_lexer_perf.py）；
          # FreeBSD runner 比 Linux 慢约 1.7x，实测 3.53s，给 5.0s 预算作为 CI 门禁（仍能在严重回退时失败）。
          LEXER_PERF_LIMIT: "5.0"
        run: |
          . .venv/bin/activate
          pytest tests/unit/ tests/integration/ -v --tb=short

      - name: 端到端测试
        run: |
          . .venv/bin/activate
          pytest tests/e2e/ -v --tb=short

      # 根目录测试（与 GitHub Linux job 一致；失败不阻塞，和原配置相同）
      #
      # 注意：文件名必须跟着主干走。合并后 light 是主干，段言旧名
      # test_duan_syntax / test_duan_stdlib / test_duan_stdlib2 在本仓库并不存在；
      # 这一步结尾是 `|| true`，点错名字不会报错、只会一个用例都没跑到——假绿比没有更坏。
      # 已改回实际存在的 test_light_syntax / test_light_stdlib / test_light_stdlib2
      # （全部 27 个文件已逐个核对存在）。
      - name: 根目录测试
        run: |
          . .venv/bin/activate
          pytest tests/test_parser.py tests/test_lexer.py tests/test_async.py tests/test_codegen.py tests/test_exception.py tests/test_executor.py tests/test_semantic.py tests/test_class_definition.py tests/test_light_syntax.py tests/test_e2e.py tests/test_edge_cases.py tests/test_commands.py tests/test_file_io.py tests/test_interface.py tests/test_json_import.py tests/test_module_system.py tests/test_module_resolver.py tests/test_summary.py tests/test_ternary.py tests/test_advanced_semantic.py tests/test_light_stdlib.py tests/test_light_stdlib2.py tests/test_class_advanced.py tests/test_llvm_async.py tests/test_lsp_protocol.py tests/test_lsp_protocol_full.py tests/test_modern_features.py -v --tb=short --ignore=tests/archive 2>&1 || true


      - name: 统一测试运行器
        run: |
          . .venv/bin/activate
          python tests/run_tests.py --quick

      # 积木库门禁：五把尺子 + 硬门槛 + 兜底闸门。此前积木库（选块器 / 概念词典 / 契约索引 /
      # 兜底）在 gitea CI 上零覆盖，回归全靠人手跑尺子；段言本体 tests 过了也拦不住积木库回退。
      # 这里等价于 .github/workflows/eval.yml，但跑在本地 FreeBSD runner（无 Docker、系统
      # python3、本地 devpi 镜像），把「合入 main」变成有闸门拦截：主基准掉链路 / 留出段掉点 /
      # 块跑不起来 / 兜底闸门不过，CI 直接红。
      - name: 积木库门禁（五把尺子 + 兜底闸门）
        run: |
          . .venv/bin/activate
          # 少数块依赖第三方包；装不上不致命（冒烟会标成「缺依赖」单列，不计入分母）
          python -m pip install pypinyin lunardate opencc-python-reimplemented || true
          python 积木库/评估/ci_eval.py --并发 8
