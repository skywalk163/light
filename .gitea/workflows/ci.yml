# 光明 Light · 本地 CI（Gitea Actions，FreeBSD host 模式，无 Docker）
#
# 这份文件源自段言侧，v7 合并后主干是 light，已按主干校正。
#
# 等价于 .github/workflows/ci.yml 的 Linux 测试路径：
#   - runs-on: freebsd（act_runner host 执行器；FreeBSD 无原生 Docker，只能 host 模式）
#   - 去掉 os 矩阵与 actions/setup-python，改用 jail 内系统 python3 建 venv
#   - checkout 走本地 actions/checkout 镜像
#   - 去掉 GitHub 专属的 build/twine/upload-artifact（release/publish 不在本地跑）
#
# 测试依赖只装 pytest（本项目 runtime 依赖为空，pyproject dependencies=[]，测试直接
# import 仓库内 src/ 模块）。pytest-cov 曾装但从未有一步用 --cov，2026-08-22 去掉。
#
# v7 单 30（族 3）曾试过在这里加一步装示例侧三方库（numpy/pandas/matplotlib/
# scikit-learn/sympy），让 examples/L4_python/* 与 L3_domain/demo3_math 在 CI 上真跑。
# **run 27 实测不可行**：本 runner 的 pip 指向本地 devpi 镜像
# `http://127.0.0.1:3141/root/pypi/+simple/`，该镜像**没有 numpy**——
# `ERROR: Could not find a version that satisfies the requirement numpy>=1.22
# (from versions: none)`，且列版本时先 `Read timed out`。不是 FreeBSD 编译失败，
# 是索引侧根本取不到包。已回退这一步；这批红仍按存量环境欠账留在
# tests/ci_baseline_failures.txt（族 3 原 14 条 = 7 示例 × 2 腿，现存 12 条）。
# 要真正装齐，需在宿主侧解决：给 devpi 镜像补上游/预热这几个包，或走
# `pkg install py311-numpy …` + venv `--system-site-packages`（需 jail 内 root）。
#
# 宿主侧盘点（fb5 = 192.168.1.5，FreeBSD 14.3-RELEASE-p7，act_runner 跑在 host 上）：
#   - py311 已装：numpy 1.26.4、requests 2.32.5（pandas/matplotlib/sklearn/sympy/scipy 无）
#   - py312 只有 gdbm/sqlite3/tkinter，科学计算包一个都没有
#     → 把 venv 换成 python3.12 是净亏（白丢现成的 numpy 和 requests），不做。
#   - `pkg install` 目前被两件事卡住：`/usr` 是只读 nullfs 挂载；quarterly 仓库的包
#     按 userland 1404000 构建而本机是 1403000（需 IGNORE_OSVERSION）。
#     **2026-08-18 用户裁决：搁置**——安全原因不做宿主挂载变更，FreeBSD 升级条件也不成熟。
#     族 3 剩余 12 条按长期环境欠账留在基线里，不要再提议 remount /usr 或升级系统。
# 因此这里的 venv 加 `--system-site-packages`：零宿主改动，把已装的 numpy 暴露给 CI venv，
# 让 demo1_numpy_mean（只依赖 numpy）真跑。其余 6 例仍缺包，继续留在基线里。
#
# runner 部署（jail + act_runner 自编译 + 标签/镜像）见 docs/CI_gitea_freebsd部署.md。
#
# ── 2026-08-22 CI 时间治理（用户裁决）─────────────────────────────────────────
# 预算：pull_request ≤ 600s，push main ≤ 1200s，**超了按红**（不是文档里的建议）。
# 判定见最后一步；打点用 tools/ci/time_budget.py，各段耗时会打在同一处，
# 不用翻整份 raw log 猜时间花哪了。
#
# 这一轮做的三件事：
#   1) 步骤去重：原先「单元+集成」「e2e」「根目录 27 个文件」「统一测试运行器」四步里，
#      根目录那步是 `-v … || true`（不判绿、不产 junit），统一运行器 `--quick` 只是 4 条
#      `os.path.exists` 断言——两步合计几乎零信号却各付一次解释器启动 + 一遍收集。
#      现在收成两次 pytest：一次 `tests`（排除 e2e）+ 一次 `tests/e2e`。
#      注意：合并后覆盖面是**变大**的（根目录实际有 ~130 个 test_*.py，旧步只点了 27 个）。
#      为了不让「省启动」偷偷变成「口径升级」，回归闸门对根目录那批传
#      `--soft-classname`：照跑、照报，但不拦——与旧 `|| true` 等价。
#   2) 并行：装得上 pytest-xdist 就 `-n auto`，装不上退回串行（devpi 镜像不保证有，
#      所以 `|| true` + import 探测，绝不因为缺包让 CI 红）。
#   3) 日志瘦身：pyproject 的 addopts 去掉了全局 `-v`（约 3800 条用例逐条打印纯属浪费），
#      改成 `--durations=15`，谁慢每轮自报。
name: CI

on:
  push:
    branches: [main, merge-v7]
  pull_request:
    branches: [main, merge-v7]
  workflow_dispatch:

jobs:
  test:
    runs-on: freebsd
    steps:
      - name: Checkout
        # 固定走本地 actions/checkout，避免 Gitea 对裸写 uses 的解析偶发回落到 github.com
        uses: http://192.168.1.5:3000/actions/checkout@v4

      # 计时起点要压在装依赖**之前**：装依赖也是 CI 时间，不能不算。
      - name: 计时起点
        run: python3 tools/ci/time_budget.py --mark 起点 --fresh

      - name: 安装测试依赖 (venv)
        run: |
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pytest
          # xdist 是加速项而非依赖：本地 devpi 镜像不保证有，装不上就串行跑。
          python -m pip install pytest-xdist || true

      - name: 计时打点（装依赖）
        run: python3 tools/ci/time_budget.py --mark 装依赖

      # 这一步只负责「跑 + 产出 junit」，**不自己判绿**。
      # 原因：本仓库有一批 v7 收尾期的存量失败（见 docs/v7_失败用例根因聚类工单.md，
      # 最大一类是「单 02 · 紧凑写法分词族」）。硬判绿会让 CI 常红成背景噪音，
      # 失去「挡回归」的信号价值。判绿统一交给下面的基线闸门：
      # 只有冒出 tests/ci_baseline_failures.txt 之外的新失败才算回归。
      #
      # `|| true` 之后紧跟 `test -f`：pytest 因存量失败返回非 0 要放行，
      # 但如果它是崩溃/根本没跑起来（连 junit 都没产出），这一步必须红。
      - name: 全量测试（除 e2e，产出 junit）
        env:
          # 词法器 perf 预算：本地开发默认 2.0s（见 test_lexer_perf.py）；
          # FreeBSD host runner 与 e2e 争抢时会被重载拖慢——run 19 实测 12.76s
          # （同轮 unit 步整体 170s vs 常态 47s），5.0s 会周期性误伤门禁。
          # v7 单 25 口径：提到 20.0（实测最坏值约 1.5 倍余量），仍能拦下 O(n^2) 级回退。
          LEXER_PERF_LIMIT: "20.0"
        run: |
          . .venv/bin/activate
          mkdir -p .ci
          if python -c 'import xdist' >/dev/null 2>&1; then PAR="-n auto"; else PAR=""; fi
          echo "[CI] 并行参数：${PAR:-（串行：未装 pytest-xdist）}"
          # D3-3：纯光明测试（*_light.py）从这一轮统一 pytest 里摘出来单独跑，
          # 既给可见性、也单独归账耗时。它们的判绿口径仍是 soft（走下面的回归闸门
          # --soft-classname 'tests.test_*'），不悄悄升级成判绿点。
          pytest tests --ignore=tests/e2e \
            --ignore=tests/test_agent_loop_light.py \
            --ignore=tests/test_bootstrap_light.py \
            --ignore=tests/test_event_bus_light.py \
            --ignore=tests/test_llm_client_light.py \
            --ignore=tests/test_path_guard_light.py \
            --ignore=tests/test_plugin_light.py \
            --ignore=tests/test_process_tree_light.py \
            --ignore=tests/test_pty_light.py \
            --ignore=tests/test_schema_light.py \
            --ignore=tests/test_sse_light.py \
            --ignore=tests/test_tls_light.py \
            -q $PAR \
            --junitxml=.ci/non-e2e.xml || true
          test -f .ci/non-e2e.xml

      - name: 计时打点（全量除 e2e）
        run: python3 tools/ci/time_budget.py --mark 全量除e2e

      # e2e 单独一轮：它的成本几乎全是子进程启动（tests/e2e/test_e2e_chain.py 每个
      # 用例 spawn 一到两次 `python -m cli.light_unified`，117 个示例 ≈ 350 次启动）。
      # 和上面合在一起跑没有额外收益，分开还能让 --durations 的归属清楚。
      - name: 端到端测试（产出 junit）
        run: |
          . .venv/bin/activate
          if python -c 'import xdist' >/dev/null 2>&1; then PAR="-n auto"; else PAR=""; fi
          pytest tests/e2e -q $PAR --junitxml=.ci/e2e.xml || true
          test -f .ci/e2e.xml

      # D3-3：纯光明测试显式清单（soft 可见性 + 耗时归账）。
      # 这 9 个文件走 soft 口径（与上面统一 pytest 摘出前的覆盖一致，只是单独成步）。
      # 判绿不拦：结尾 || true，失败放行但 junit 照产，交给下面回归闸门按基线对比。
      - name: 纯光明测试（显式清单·soft）
        run: |
          . .venv/bin/activate
          if python -c 'import xdist' >/dev/null 2>&1; then PAR="-n auto"; else PAR=""; fi
          pytest tests/test_agent_loop_light.py tests/test_bootstrap_light.py \
            tests/test_event_bus_light.py tests/test_llm_client_light.py \
            tests/test_path_guard_light.py tests/test_plugin_light.py \
            tests/test_process_tree_light.py tests/test_pty_light.py \
            tests/test_schema_light.py -q $PAR --junitxml=.ci/light_soft.xml || true
          test -f .ci/light_soft.xml

      # D3-3：硬判绿点（不允许 soft）。这两份文件头已明写「纯离线、不许 skip」，
      # 是 M4/M5 的判据，必须真过。无 || true → 失败即红。
      # （test_deepseek_mock.py / test_agent_tools_light.py 属 A3/B3，合入后由对应任务升级，
      #   本轮 main 尚不存在，不在此列。）
      - name: 纯光明硬判绿点（TLS/SSE）
        run: |
          . .venv/bin/activate
          pytest tests/test_tls_light.py tests/test_sse_light.py -q --junitxml=.ci/light_hard.xml
          test -f .ci/light_hard.xml

      - name: 计时打点（e2e）
        run: python3 tools/ci/time_budget.py --mark e2e

      # 真正的判绿点：与基线快照对比，只拦新增打红。
      # 基线刷新（修好一批之后）：
      #   python tools/ci/check_regression.py --junit '.ci/*.xml' \
      #       --write-baseline tests/ci_baseline_failures.txt
      #
      # --soft-classname 两条覆盖根目录 tests/test_*.py 与 tests/_test_*.py：
      # 它们在旧配置里是 `|| true` 跑的非阻塞步，并入统一 pytest 后保持同一口径。
      # tests/unit/**、tests/integration/**、tests/e2e/** 不在豁免内，照常硬判。
      - name: 回归闸门（基线对比）
        run: |
          . .venv/bin/activate
          python tools/ci/check_regression.py \
            --junit .ci/non-e2e.xml \
            --junit .ci/e2e.xml \
            --junit .ci/light_soft.xml \
            --baseline tests/ci_baseline_failures.txt \
            --soft-classname 'tests.test_*' \
            --soft-classname 'tests._test_*'

      # lightpub 文档可导入性闸门。
      # 这条本来就在 tests/unit/ 里、上面那轮已经跑过；这里**故意重跑一遍**（几秒），
      # 因为回归闸门是「与基线对比」——刷一次基线就能把它压下去。文档说谎不该有
      # 「进基线」这个选项，所以再挂一道不看基线的硬判绿点。
      #
      # 它补的是已有文档示例扫描面（tests/unit/doc_block_scan.py）的盲区：
      # 那道扫描只验证「能否编译」，而 `导入 GUI框架` 编译完全正常、
      # 生成 `import stdlib.lightpub.GUI框架`，运行时才 ModuleNotFoundError。
      # 编译期正确、运行期骗人的块，只有真去 import 一遍才抓得到。
      - name: lightpub 文档可导入性闸门
        run: |
          . .venv/bin/activate
          pytest tests/unit/test_lightpub_doc_importability.py -q

      # 积木库门禁：五把尺子 + 硬门槛 + 兜底闸门。此前积木库（选块器 / 概念词典 / 契约索引 /
      # 兜底）在 gitea CI 上零覆盖，回归全靠人手跑尺子；段言本体 tests 过了也拦不住积木库回退。
      # 这里等价于 .github/workflows/eval.yml，但跑在本地 FreeBSD runner（无 Docker、系统
      # python3、本地 devpi 镜像），把「合入 main」变成有闸门拦截：主基准掉链路 / 留出段掉点 /
      # 块跑不起来 / 兜底闸门不过，CI 直接红。
      - name: 积木库门禁（五把尺子 + 兜底闸门）
        run: |
          . .venv/bin/activate
          # 少数块依赖第三方包；装不上不致命（冒烟会标成「缺依赖」单列，不计入分母）
          python -m pip install pypinyin lunardate opencc-python-reimplemented || true
          python 积木库/评估/ci_eval.py --并发 8

      # D3-1/D3-2：两道质量度量门禁。都是「基线对比、只拦新增」，不是一刀切阈值——
      # 存量违规按白名单 + 计数上限锁住，删一条不能换新增一条（白名单按 file:line:cat
      # 精确匹配）。刷新基线要显式改命令：
      #   python tools/ci/assert_quality.py --write-baseline tests/ci_baseline_assert_quality.txt
      #   python tools/ci/bootstrap_rate.py --write-baseline tests/ci_baseline_bootstrap.txt
      - name: 断言质量门禁（假绿形态·基线对比）
        run: |
          . .venv/bin/activate
          # 扫描根 = 全仓（2026-08-23 用户裁决）。原来只扫 tests/，同形态违规在
          # tests/ 之外还有 50 条（antlrparser/、tools/、examples/ 的自测脚本），
          # 门禁的覆盖面窄于它自己声明的形态覆盖面。全仓实测 1.7s，仍在 <5s 承诺内。
          python tools/ci/assert_quality.py --root .

      # 自举率门禁：口径见 任务书/第三轮总纲 §2.3 —— **只认文件维度**
      # （stdlib 下每个 .light 文件有无 decl ≥ 1 的真实现），行维度只打印不判绿。
      # 门禁守两条：已破零的文件不许退回 0；文件维度自举率不许下降。
      - name: 自举率门禁（文件维度·不许回退）
        run: |
          . .venv/bin/activate
          python tools/ci/bootstrap_rate.py --root .

      # 时间预算硬闸门（2026-08-22 用户裁决）：PR ≤ 600s，push main ≤ 1200s。
      # always() 是故意的：前面哪一步红了，也要把耗时账单打出来——不然一红就看不到时间数据，
      # 下次还是只能靠猜。
      - name: 时间预算闸门
        if: always()
        run: |
          . .venv/bin/activate
          python tools/ci/time_budget.py --mark 闸门与积木库
          BUDGET=1200
          if [ "${{ github.event_name }}" = "pull_request" ]; then BUDGET=600; fi
          python tools/ci/time_budget.py --check --budget $BUDGET
