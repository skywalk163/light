# light · 本地 CI（Gitea Actions，FreeBSD host 模式，无 Docker）
#
# 依赖安装改为「持久 venv 复用」：第三方依赖（pytest/pytest-cov/antlr4 运行时）
# 装进 /var/db/act_runner/venvs/light 跨 run 复用；项目自身 editable 指向
# /var/db/act_runner/venvs/light.src（每 run ln -sfn $PWD 更新）。
#
# 关于测试范围：
#   light 的 antlrparser/test/ 下的用例依赖由 .g4 生成的
#   LightLangLexer.py / LightLangParser.py。这两个文件不进 git，且本机未装 Java
#   （antlr4-tools 需要 Java 才能 codegen），所以 CI 只跑「代码无关」的 tests/ 套件。
#   等后续把 codegen 接进 CI（装 Java + antlr4-tools，或把生成产物提交进仓库），
#   再放开 antlrparser/test/。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: freebsd
    steps:
      - name: Checkout
        uses: http://192.168.1.5:3000/actions/checkout@v4

      - name: 准备持久 venv（第三方依赖复用）
        run: |
          VENV_BIN="$(/usr/local/sbin/ci_venv.sh light 'pytest pytest-cov antlr4-python3-runtime')"
          echo "VENV_BIN=$VENV_BIN" >> "$GITHUB_ENV"
          ln -sfn "$PWD" "/var/db/act_runner/venvs/light.src"
          "$VENV_BIN/pip" install -e "/var/db/act_runner/venvs/light.src" --no-build-isolation >/dev/null 2>&1 || "$VENV_BIN/pip" install -e . --no-build-isolation >/dev/null 2>&1 || true

      - name: 测试
        run: |
          . "$VENV_BIN/activate"
          # light_visitor / light_compiler 等模块位于 antlrparser/，测试用裸 import
          # （from light_visitor import ...），需把 antlrparser/ 与仓库根加进 PYTHONPATH 才能解析。
          export PYTHONPATH="$PWD:$PWD/antlrparser"
          # 只跑「代码无关」的 tests/ 套件；antlrparser/test/ 依赖 ANTLR codegen（本机无 Java）跳过。
          if [ -d tests ] && [ -n "$(find tests -name '*.py' | head -1)" ]; then
            pytest tests -v --tb=short
          else
            echo "未检测到测试目录，跳过 pytest"
          fi
