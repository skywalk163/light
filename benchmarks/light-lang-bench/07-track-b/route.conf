# MiniBridge 路由表（service → handler）
#
# 格式（见 规格.md §2.1）：
#   - 每行一条映射：service<TAB>handler，列间必须是**单个 TAB**（0x09），
#     前后不允许空格；handler 列内部不可含空白。
#   - # 开头的行为注释；整行空白（含只有空格/TAB 的行）忽略。
#   - 必须且只能有一行通配：`*<TAB>handler`，service 列恰好是单个 *。
#   - 同名 service 出现两次 → 后一条覆盖前一条（规格 §2.3）。
#   - 查不到的 service 走通配那一行。
#
# 本表只描述「哪个 service 交给哪个 handler」，不含任何路由逻辑：
# 查表、默认分支必须在光明侧完成（规格 §2.2 / DoD D4）。
#
# handler 列取值：
#   h_py_append       → handlers/h_py_append.py（Python，进程方式）
#   h_go_len          → handlers/h_go_len/h_go_len（Go，进程方式）
#   h_c_hash          → C；B1 用 CLI 形态（handlers/h_c_hash），B2 用 C FFI 直调同名算法
#   h_does_not_exist  → 边界用例：解析到但不存在 → 该行输出 ERR（DoD D3）

# service<TAB>handler
notes	h_py_append
measure	h_go_len
hash	h_c_hash
broken	h_does_not_exist
*	h_py_append
