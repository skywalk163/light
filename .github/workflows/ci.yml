# 光明 Light · GitHub CI
#
# ── 2026-08-22 CI 时间治理（用户裁决）─────────────────────────────────────────
# 预算：pull_request ≤ 600s，push main ≤ 1200s，**超了按红**（见最后一步）。
# GitHub 侧这一轮只做「削矩阵 + 加缓存 + 去无用依赖」：
#   - PR 只跑 ubuntu × (3.10, 3.13) —— 4 个 py × 3 个 os = 12 份重复跑，
#     对一个纯 stdlib 项目基本是在重复验证同一件事；跨 os/py 全矩阵挪到 push main。
#   - actions/setup-python 开 pip 缓存。
#   - 装依赖去掉 pytest-cov：从来没有一步用过 --cov，纯白装。
#   - 去掉「统一测试运行器」步（tests/run_tests.py --quick 只是 4 条 os.path.exists
#     断言，零信号却要付一次解释器启动）。
# 权威门禁在 .gitea/workflows/ci.yml（带基线闸门 + 积木库门禁）；这边是镜像验证。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      # PR 走窄矩阵（2 份），push main / 手动触发走全矩阵（12 份）。
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.10","3.13"]') || fromJSON('["3.10","3.11","3.12","3.13"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: 计时起点
        shell: bash
        run: python tools/ci/time_budget.py --mark 起点 --fresh

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          # cryptography 是 tests/test_tls_light.py 的测试侧硬依赖（模块级
          # `from cryptography import x509`，用来在临时目录生成自签证书）。
          # 下面那道 TLS/SSE 硬判绿点没有 || true，缺了它整步 collect 就红——
          # 而且红的是「装不上依赖」，不是「TLS 实现坏了」，属于噪声红。
          python -m pip install cryptography


      # 运行单元测试（所有平台）
      - name: Unit Tests
        run: |
          pytest tests/unit/

      # 运行集成测试
      - name: Integration Tests
        run: |
          pytest tests/integration/

      # 运行端到端测试（Linux/macOS）
      - name: End-to-End Tests
        if: runner.os != 'Windows'
        run: |
          pytest tests/e2e/

      # 运行 legacy 功能测试（Linux 完整运行）
      - name: Legacy Feature Tests
        if: runner.os == 'Linux'
        run: |
          python tests/_test_three_features.py
          python tests/_test_hm_inference.py
          python tests/_test_null_safety.py
          python tests/_test_package_system.py

      # 根目录测试（历史口径：不阻塞。文件名必须跟着主干走——结尾是 `|| true`，
      # 点错名字不会报错、只会一个用例都没跑到，假绿比没有更坏。已逐个核对存在。）
      - name: Root Directory Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          pytest tests/test_parser.py tests/test_lexer.py tests/test_async.py tests/test_codegen.py tests/test_exception.py tests/test_executor.py tests/test_semantic.py tests/test_class_definition.py tests/test_light_syntax.py tests/test_e2e.py tests/test_edge_cases.py tests/test_commands.py tests/test_file_io.py tests/test_interface.py tests/test_json_import.py tests/test_module_system.py tests/test_module_resolver.py tests/test_summary.py tests/test_ternary.py tests/test_advanced_semantic.py tests/test_light_stdlib.py tests/test_light_stdlib2.py tests/test_class_advanced.py tests/test_llvm_async.py tests/test_lsp_protocol.py tests/test_lsp_protocol_full.py tests/test_modern_features.py -q 2>&1 || true

      - name: Root Directory Tests (Cross-platform)
        if: runner.os != 'Linux'
        run: |
          pytest tests/test_parser.py tests/test_lexer.py tests/test_light_syntax.py tests/test_edge_cases.py tests/test_commands.py tests/test_module_system.py tests/test_summary.py -q 2>&1 || true

      # D3-3：纯光明测试显式清单（soft 可见性 + 耗时归账）。
      # 9 个文件走 soft 口径：结尾 || true，失败放行但 junit 照产。
      - name: Pure-Light Tests (explicit, soft)
        if: runner.os == 'Linux'
        run: |
          pytest tests/test_agent_loop_light.py tests/test_bootstrap_light.py \
            tests/test_event_bus_light.py tests/test_llm_client_light.py \
            tests/test_path_guard_light.py tests/test_plugin_light.py \
            tests/test_process_tree_light.py tests/test_pty_light.py \
            tests/test_schema_light.py -q 2>&1 || true

      # D3-3：硬判绿点（不允许 soft）。两份文件头明写「纯离线、不许 skip」，是 M4/M5 判据。
      # 无 || true → 失败即红。（test_deepseek_mock.py / test_agent_tools_light.py 属 A3/B3，
      # 合入后由对应任务升级；本轮 main 尚不存在，不在此列。）
      - name: Pure-Light Hard Gate (TLS/SSE)
        if: runner.os == 'Linux'
        run: |
          pytest tests/test_tls_light.py tests/test_sse_light.py -q

      # D3-1/D3-2：两道质量度量门禁（只在 Linux 跑一份，跨平台跑它没有额外信号）。
      # 都是基线对比、只拦新增；权威副本在 .gitea/workflows/ci.yml，这边是镜像验证。
      - name: 断言质量门禁（假绿形态·基线对比）
        if: runner.os == 'Linux'
        run: |
          python tools/ci/assert_quality.py --root tests

      - name: 自举率门禁（文件维度·不许回退）
        if: runner.os == 'Linux'
        run: |
          python tools/ci/bootstrap_rate.py --root .

      # 时间预算硬闸门。always()：前面红了也要把耗时账单打出来，否则一红就没时间数据。
      - name: 时间预算闸门
        if: always()
        shell: bash
        run: |
          python tools/ci/time_budget.py --mark 测试收尾
          BUDGET=1200
          if [ "${{ github.event_name }}" = "pull_request" ]; then BUDGET=600; fi
          python tools/ci/time_budget.py --check --budget $BUDGET

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
      - name: Lint check
        run: |
          flake8 src/ cli/ --count --statistics --max-line-length=120 || true

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify package metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # 独立可执行文件构建（光明侧原有产物 light6）。
  # 三平台打包每次都要装 pyinstaller + 冷启动，只在 push main / 手动触发时跑；
  # PR 阶段不需要三个平台的二进制。
  exe:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe-suffix: ""
          - os: windows-latest
            exe-suffix: ".exe"
          - os: macos-latest
            exe-suffix: ""
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
      - name: Build standalone executable
        run: |
          python build_exe.py
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: light6-${{ matrix.os }}
          path: dist/light6${{ matrix.exe-suffix }}
