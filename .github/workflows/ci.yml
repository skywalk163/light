name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov

      # 运行单元测试（所有平台）
      - name: Unit Tests
        run: |
          pytest tests/unit/ -v --tb=short

      # 运行集成测试
      - name: Integration Tests
        run: |
          pytest tests/integration/ -v --tb=short

      # 运行端到端测试（Linux/macOS）
      - name: End-to-End Tests
        if: runner.os != 'Windows'
        run: |
          pytest tests/e2e/ -v --tb=short

      # 运行 legacy 功能测试（Linux 完整运行）
      - name: Legacy Feature Tests
        if: runner.os == 'Linux'
        run: |
          python tests/_test_three_features.py
          python tests/_test_hm_inference.py
          python tests/_test_null_safety.py
          python tests/_test_package_system.py

      # 运行根目录测试文件（Linux 完整运行，其他平台基础运行）
      - name: Root Directory Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          pytest tests/test_parser.py tests/test_lexer.py tests/test_async.py tests/test_codegen.py tests/test_exception.py tests/test_executor.py tests/test_semantic.py tests/test_class_definition.py tests/test_light_syntax.py tests/test_e2e.py tests/test_edge_cases.py tests/test_commands.py tests/test_file_io.py tests/test_interface.py tests/test_json_import.py tests/test_module_system.py tests/test_module_resolver.py tests/test_summary.py tests/test_ternary.py tests/test_advanced_semantic.py tests/test_light_stdlib.py tests/test_light_stdlib2.py tests/test_class_advanced.py tests/test_llvm_async.py tests/test_lsp_protocol.py tests/test_lsp_protocol_full.py tests/test_modern_features.py -v --tb=short --ignore=tests/archive 2>&1 || true

      - name: Root Directory Tests (Cross-platform)
        if: runner.os != 'Linux'
        run: |
          pytest tests/test_parser.py tests/test_lexer.py tests/test_light_syntax.py tests/test_edge_cases.py tests/test_commands.py tests/test_module_system.py tests/test_summary.py -v --tb=short --ignore=tests/archive 2>&1 || true

      # 统一测试运行器（Linux 完整运行）
      - name: Unified Test Runner
        if: runner.os == 'Linux'
        run: |
          python tests/run_tests.py --quick

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
      - name: Lint check
        run: |
          flake8 src/ cli/ --count --statistics --max-line-length=120 || true

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify package metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # 独立可执行文件构建（光明侧原有产物 light6）
  exe:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe-suffix: ""
          - os: windows-latest
            exe-suffix: ".exe"
          - os: macos-latest
            exe-suffix: ""
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
      - name: Build standalone executable
        run: |
          python build_exe.py
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: light6-${{ matrix.os }}
          path: dist/light6${{ matrix.exe-suffix }}
