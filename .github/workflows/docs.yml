# 光明文档站点 - GitHub Pages 部署工作流
#
# 功能：
#   1. 在 push 到 main 或 4.0dev 分支时触发
#   2. 安装 mkdocs 和 Material 主题
#   3. 构建静态文档站点
#   4. 部署到 GitHub Pages
#
# 前置条件：
#   - 在 GitHub 仓库 Settings > Pages > Source 中选择 "GitHub Actions"
#   - 仓库需要 GITHUB_TOKEN 权限（默认已配置）

name: Deploy Docs

on:
  push:
    branches: [main, 4.0dev]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      deploy_to_pages:
        description: '部署到 GitHub Pages'
        required: true
        default: 'true'

# 权限：需要写入内容以部署 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：同一组中只有一个部署在运行
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install mkdocs and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs mkdocs-material
          python -m pip install mkdocs-git-revision-date-localized-plugin
          python -m pip install pymdown-extensions

      - name: Generate API reference docs
        run: |
          python playground/api_docs_generator.py --output docs/api

      - name: Build mkdocs site
        run: |
          mkdocs build --site-dir site

      - name: Copy docs-site assets
        run: |
          # 如果存在 docs-site 目录，复制到 site 目录
          if [ -d "docs-site" ]; then
            cp -r docs-site/* site/ 2>/dev/null || true
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4