# T-0322 dogfood 场景回归 —— 目录级判据配置
#
# 仓库根 pyproject.toml 的 addopts 依赖 pytest-xdist / pytest-timeout 插件，
# 本机未安装。这里自带一份最小配置，使 `python -m pytest -q tests/dogfood/`
# 不依赖插件即可运行；用例内部的 CLI 子进程自带 subprocess 超时。
# -p no:cacheprovider：避免在受限目录下建 .pytest_cache 触发写权限告警。
# 装了插件的机器上仍可用 `python -m pytest -c pyproject.toml -n 4 tests/dogfood/` 覆盖。
[pytest]
testpaths = .
python_files = test_*.py
addopts = --tb=short -ra -p no:cacheprovider
markers =
    slow: 慢测试（dogfood 用例均为本地 CLI 探测，默认不标 slow）
